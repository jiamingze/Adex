map $uri $adex_path {
    ~^/api/v1/(media|previews)/ /api/v1/private-ticket;
    default $uri;
}
log_format adex '$remote_addr [$time_local] "$request_method $adex_path $server_protocol" $status $body_bytes_sent';
server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $adex_app http://adex-app:8080;
    access_log /dev/stdout adex;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; frame-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /api/v1/files {
        client_max_body_size 26m;
        proxy_pass $adex_app$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass $adex_app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 180s;
        add_header Cache-Control no-store always;
    }
    location /health/ {
        proxy_pass $adex_app$request_uri;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
