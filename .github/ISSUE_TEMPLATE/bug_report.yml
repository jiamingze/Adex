name: Bug report / 问题报告
description: Report a reproducible issue without secrets or personal data.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS, browser/device, commit, mock or provider model. Never paste API keys.
  - type: textarea
    id: logs
    attributes:
      label: Redacted evidence / 脱敏证据
