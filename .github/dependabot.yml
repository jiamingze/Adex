version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      actions: {patterns: ['*']}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      frontend-minor:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      java-minor:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: uv
    directories: [/, /services/adex-agent, /services/adex-tools]
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      python-minor:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/services/adex-app, /services/adex-automation, /services/adex-agent, /services/adex-tools]
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
