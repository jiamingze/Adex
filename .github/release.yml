changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features / 功能
      labels: [enhancement]
    - title: Fixes / 修复
      labels: [bug]
    - title: Documentation / 文档
      labels: [documentation]
    - title: Dependencies / 依赖
      labels: [dependencies]
    - title: Other changes / 其他
      labels: ['*']
