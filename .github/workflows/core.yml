name: core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.10.9"}
      - uses: pnpm/action-setup@v4
        with: {version: "10.11.0"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 redis-server ffmpeg
      - run: make setup
      - run: uv run --project services/adex-tools playwright install-deps chromium
      - run: make build
      - name: Unit and contract tests
        run: |
          if make test > /tmp/adex-unit.log 2>&1; then
            cat /tmp/adex-unit.log
          else
            cat /tmp/adex-unit.log
            python3 - <<'PYLOG'
          from pathlib import Path
          tail = "\n".join(Path("/tmp/adex-unit.log").read_text().splitlines()[-180:])
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Unit test failure context::" + escaped)
          PYLOG
            exit 1
          fi
      - run: make check-style
      - run: uv run ruff check services/adex-agent/src services/adex-tools/src packages/python-kernel/src
      - run: python3 scripts/init_env.py && python3 scripts/local_infra.py
      - run: make test-integration
      - run: git diff --exit-code packages/contracts/core.generated.ts
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix: {service: [adex-app, adex-automation, adex-agent, adex-tools]}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/${{ matrix.service }}/Dockerfile .
