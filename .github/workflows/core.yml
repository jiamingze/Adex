name: core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: {version: "0.10.9"}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: {version: "10.11.0"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22", cache: pnpm}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 redis-server ffmpeg
      - run: make setup
      - run: uv run --project services/adex-tools playwright install-deps chromium
      - name: Allow the installed Chromium sandbox on Ubuntu
        run: |
          python3 scripts/ci_chromium_profile.py > /tmp/adex-chromium.apparmor
          sudo apparmor_parser -r /tmp/adex-chromium.apparmor
      - run: make build
      - name: Unit and contract tests
        run: python3 scripts/ci_run.py make test
      - run: uv run python scripts/check_secrets.py
      - run: make check-style
      - run: uv run ruff check services/adex-agent/src services/adex-tools/src packages/python-kernel/src
      - run: python3 scripts/ci_run.py python3 scripts/init_env.py
      - run: python3 scripts/ci_run.py python3 scripts/local_infra.py
      - run: python3 scripts/ci_run.py make test-integration
      - run: git diff --exit-code packages/contracts/core.generated.ts
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: {service: [adex-app, adex-automation, adex-agent, adex-tools]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f services/${{ matrix.service }}/Dockerfile .
