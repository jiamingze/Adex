[project]
name = "adex-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "adex-kernel",
    "cryptography>=46.0.3",
    "uvicorn==0.54.0",
    "beautifulsoup4==4.15.0",
    "pypdf>=6.20.1",
    "playwright==1.64.0",
    "tldextract==5.4.0",
]
[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.17.0"]
[tool.uv.sources]
adex-kernel = { path = "../../packages/python-kernel", editable = true }
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/adex_tools"]
[tool.ruff]
line-length = 110
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
