[project]
name = "adex-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "adex-kernel",
    "cryptography>=46.0.3",
    "uvicorn==0.34.2",
    "beautifulsoup4==4.13.4",
    "pypdf>=6.20.0",
    "playwright==1.55.0",
    "tldextract==5.3.0",
    "websockets>=15,<17",
]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.11.9"]
[tool.uv.sources]
adex-kernel = { path = "../../packages/python-kernel", editable = true }
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/adex_tools"]
[tool.ruff]
line-length = 110
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
