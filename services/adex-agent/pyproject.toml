[project]
name = "adex-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["adex-kernel", "uvicorn==0.54.0", "redis==5.3.1"]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]
[tool.uv.sources]
adex-kernel = { path = "../../packages/python-kernel", editable = true }
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/adex_agent"]
[tool.ruff]
line-length = 110
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
