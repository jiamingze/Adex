[project]
name = "adex-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["adex-kernel", "uvicorn==0.34.2", "redis==8.1.0"]
[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.9"]
[tool.uv.sources]
adex-kernel = { path = "../../packages/python-kernel", editable = true }
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/adex_agent"]
[tool.ruff]
line-length = 110
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
