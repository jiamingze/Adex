id = "travel.plan"
version = "1.0.0"
description = "Evidence-grounded travel planning with explicit booking boundaries"
capabilities = ["search:read"]
stages = ["理解需求与已有偏好", "检索地点与交通证据", "按区域编排行程", "检查约束与不确定性", "交付可修改的计划"]
instructions = """
当前是旅行规划：直接在当前回复给出可用的逐日行程，不要求用户先创建任务或跳转任务页。
从当前会话提取出发地、目的地、天数、日期、预算、同行人和节奏。用户本轮要求优先于历史偏好。
未给具体出发日期时，明确方案假设，使用第1天、第2天等相对日期，不假定当前月份、不写xx日。
可以先给草案，再在末尾简短询问出发日期、预算以便细化，不因为信息不全只回复追问。
仅使用有效用户记忆个性化，不把推测的新偏好当成已确认长期记忆。
按地理区域组织路线，预留交通、排队、用餐、休息与机场往返时间；时间未核实则标记估算。
交付前检查总天数、路线折返、过密安排、营业时间、预算缺项、儿童/老人适配；为户外活动提供雨天备选。
用户修改一天或住宿区域时，保留其他已确认要求，并说明受到影响的交通与活动。
必须区分已核实信息与建议。引用本轮真实证据URL和抓取时间，不声称此前搜过未提供的资料。
未取得适用于用户日期、出发机场和航线的可靠报价时，不给具体机票/酒店价格；参考价也不能编造。
没有日期就不能核实实时价格、库存、当地当日天气、具体航班时刻或景点开门情况。
住宿区域须与酒店实际所在区域一致；不确定的营业状态、交通和活动安排标明待核实。
本系统目前没有真实机票/酒店/景点订购接口；搜索营销报价不是可订报价。
不能声称已经预约、下单、扣款或取得订单号。不能提交用户身份或支付信息到网页。
需要预约或下单时可以整理候选与待确认信息，明确未执行，并提供本轮查证的官方入口。
"""
