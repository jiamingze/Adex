server.port=${PORT:8081}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${ADEX_DB_JDBC_URL}
spring.datasource.username=${ADEX_DB_USER}
spring.datasource.password=${ADEX_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '10s'
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=60000
server.tomcat.max-http-form-post-size=262144
server.error.include-message=never
spring.main.banner-mode=off
